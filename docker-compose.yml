# =============================================================================
# ToggleMaster - Fase 2 - Ambiente local
#
# 5 microsserviços + 4 data stores do desafio:
#   postgres-auth (auth_db) | postgres-app (flags_db + targeting_db)
#   redis | dynamodb-local
# + elasticmq   -> emulador de SQS (a SQS não tem versão local oficial)
# + dynamodb-init -> contêiner one-shot que cria a tabela e encerra
#
# Uso:
#   cp .env.example .env
#   docker compose up --build -d
#   docker compose ps
# =============================================================================
name: togglemaster

x-python-healthcheck: &python-healthcheck
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 10s

services:

  # ---------------------------------------------------------------------------
  # Data stores
  # ---------------------------------------------------------------------------
  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-togglemaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-togglemaster}
      POSTGRES_DB: auth_db
    volumes:
      - pg-auth-data:/var/lib/postgresql/data
      # Scripts rodam em ordem alfabética, só na PRIMEIRA criação do volume
      - ./auth-service/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./local/postgres-auth/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      # Via TCP (-h 127.0.0.1): durante os scripts de init o Postgres roda um
      # servidor temporário só no socket local, então isso só passa no fim.
      test: ["CMD-SHELL", "PGPASSWORD=$${POSTGRES_PASSWORD} psql -h 127.0.0.1 -U $${POSTGRES_USER} -d auth_db -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-app:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-togglemaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-togglemaster}
      POSTGRES_DB: postgres
    volumes:
      - pg-app-data:/var/lib/postgresql/data
      - ./local/postgres-app/init-dbs.sh:/docker-entrypoint-initdb.d/01-init-dbs.sh:ro
      - ./flag-service/db/init.sql:/sql/flag-init.sql:ro
      - ./targeting-service/db/init.sql:/sql/targeting-init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      # Só fica healthy quando o init terminou e o ÚLTIMO banco (targeting_db) existe
      test: ["CMD-SHELL", "PGPASSWORD=$${POSTGRES_PASSWORD} psql -h 127.0.0.1 -U $${POSTGRES_USER} -d targeting_db -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    # -sharedDb: um único banco, independente de região/credenciais
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    working_dir: /home/dynamodblocal
    user: root
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    ports:
      - "8000:8000"

  # Cria a tabela ToggleMasterAnalytics e encerra (exit 0)
  dynamodb-init:
    image: amazon/aws-cli:latest
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        EP=http://dynamodb-local:8000
        until aws dynamodb list-tables --endpoint-url $$EP >/dev/null 2>&1; do
          echo "Aguardando DynamoDB Local..."; sleep 2
        done
        if aws dynamodb describe-table --table-name ToggleMasterAnalytics --endpoint-url $$EP >/dev/null 2>&1; then
          echo "Tabela ToggleMasterAnalytics já existe."
        else
          aws dynamodb create-table --endpoint-url $$EP \
            --table-name ToggleMasterAnalytics \
            --attribute-definitions AttributeName=event_id,AttributeType=S \
            --key-schema AttributeName=event_id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST >/dev/null
          echo "Tabela ToggleMasterAnalytics criada."
        fi

  # Emulador de SQS (a fila é criada pelo arquivo de configuração)
  elasticmq:
    image: softwaremill/elasticmq-native:latest
    volumes:
      - ./local/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    ports:
      - "9324:9324"

  # ---------------------------------------------------------------------------
  # Microsserviços
  # ---------------------------------------------------------------------------
  auth-service:
    build: ./auth-service
    image: auth-service:dev
    environment:
      PORT: "8001"
      DATABASE_URL: postgres://${POSTGRES_USER:-togglemaster}:${POSTGRES_PASSWORD:-togglemaster}@postgres-auth:5432/auth_db?sslmode=disable
      MASTER_KEY: ${MASTER_KEY:-admin-secreto-123}
    depends_on:
      postgres-auth:
        condition: service_healthy
    ports:
      - "8001:8001"
    restart: on-failure
    # Sem healthcheck: a imagem distroless não tem shell/curl.
    # No Kubernetes isso é coberto pelas readiness/liveness probes HTTP.

  flag-service:
    build: ./flag-service
    image: flag-service:dev
    environment:
      PORT: "8002"
      DATABASE_URL: postgresql://${POSTGRES_USER:-togglemaster}:${POSTGRES_PASSWORD:-togglemaster}@postgres-app:5432/flags_db
      AUTH_SERVICE_URL: http://auth-service:8001
    depends_on:
      postgres-app:
        condition: service_healthy
      auth-service:
        condition: service_started
    ports:
      - "8002:8002"
    restart: on-failure
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)"]

  targeting-service:
    build: ./targeting-service
    image: targeting-service:dev
    environment:
      PORT: "8003"
      DATABASE_URL: postgresql://${POSTGRES_USER:-togglemaster}:${POSTGRES_PASSWORD:-togglemaster}@postgres-app:5432/targeting_db
      AUTH_SERVICE_URL: http://auth-service:8001
    depends_on:
      postgres-app:
        condition: service_healthy
      auth-service:
        condition: service_started
    ports:
      - "8003:8003"
    restart: on-failure
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=2)"]

  evaluation-service:
    build: ./evaluation-service
    image: evaluation-service:dev
    environment:
      PORT: "8004"
      REDIS_URL: redis://redis:6379
      FLAG_SERVICE_URL: http://flag-service:8002
      TARGETING_SERVICE_URL: http://targeting-service:8003
      # Chave pré-cadastrada pelo seed (local/postgres-auth/02-seed.sql)
      SERVICE_API_KEY: ${SERVICE_API_KEY:-tm_key_local_evaluation_service_dev}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_SQS_URL: ${AWS_SQS_URL:-http://elasticmq:9324/000000000000/togglemaster-events}
      # Deixe vazio no .env para usar a SQS real da AWS
      AWS_SQS_ENDPOINT_URL: ${AWS_SQS_ENDPOINT_URL-http://elasticmq:9324}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
      flag-service:
        condition: service_healthy
      targeting-service:
        condition: service_healthy
      elasticmq:
        condition: service_started
    ports:
      - "8004:8004"
    restart: on-failure

  analytics-service:
    build: ./analytics-service
    image: analytics-service:dev
    environment:
      PORT: "8005"
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_SQS_URL: ${AWS_SQS_URL:-http://elasticmq:9324/000000000000/togglemaster-events}
      AWS_SQS_ENDPOINT_URL: ${AWS_SQS_ENDPOINT_URL-http://elasticmq:9324}
      AWS_DYNAMODB_TABLE: ToggleMasterAnalytics
      AWS_DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
      elasticmq:
        condition: service_started
    ports:
      - "8005:8005"
    restart: on-failure
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=2)"]

volumes:
  pg-auth-data:
  pg-app-data:
  dynamodb-data:
