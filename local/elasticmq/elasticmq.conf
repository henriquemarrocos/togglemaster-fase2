include classpath("application.conf")

# Host usado nas URLs de fila retornadas (nome do serviço no compose)
node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  togglemaster-events {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 0 seconds
  }
}
